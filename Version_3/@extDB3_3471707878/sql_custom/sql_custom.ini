[Default]
Version = 1
Strip Chars = ";[]"
Strip Chars Mode = 0
Input SQF Parser = false
Number of Retrys = 5

[newPlayer]
Return InsertID = false
Prepared Statement = true
SQL1_1 = INSERT INTO players (steam_id, name, position_x, position_y, position_z, inventory) VALUES (?, ?, ?, ?, ?, ?);
SQL1_INPUTS = 1,2,3,4,5,6

[loadPlayer]
Return InsertID = false
Prepared Statement = true
SQL1_1 = SELECT steam_id, name, CAST(IFNULL(position_x,0) AS CHAR), CAST(IFNULL(position_y,0) AS CHAR), CAST(IFNULL(position_z,0) AS CHAR), IFNULL(inventory, '') FROM players WHERE steam_id = ?;
SQL1_INPUTS = 1
OUTPUT = 1-STRING,2-STRING,3-STRING,4-STRING,5-STRING,6-STRING

[savePlayer]
Return InsertID = false
Prepared Statement = true
SQL1_1 = UPDATE players SET name = ?, position_x = ?, position_y = ?, position_z = ?, inventory = ?, last_updated = CURRENT_TIMESTAMP WHERE steam_id = ?;
SQL1_INPUTS = 1,2,3,4,5,6
